    * {
      box-sizing: border-box;
    }

    html {
      scrollbar-color: rgba(200, 230, 215, .16) transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 480px at 82% -10%, rgba(78, 217, 160, .07), transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    /* 实验室坐标网格，极淡，向页面下方渐隐 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(220, 240, 230, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220, 240, 230, .03) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 20%, transparent 85%);
      mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 20%, transparent 85%);
    }

    /* 聚光层：与底层网格同图案，但用薄荷绿高亮线条；
       由遮罩限定只在指针周围一小圈内显现，JS 写入 --mx/--my 驱动 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(78, 217, 160, .14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(78, 217, 160, .14) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(circle 170px at var(--mx, 50%) var(--my, 40%),
          rgba(0, 0, 0, .9), rgba(0, 0, 0, .45) 55%, transparent);
      mask-image: radial-gradient(circle 170px at var(--mx, 50%) var(--my, 40%),
          rgba(0, 0, 0, .9), rgba(0, 0, 0, .45) 55%, transparent);
      opacity: 0;
      transition: opacity .35s ease;
    }

    body.grid-live::after {
      opacity: 1;
    }

    ::selection {
      background: rgba(78, 217, 160, .3);
      color: #ecfff5;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(200, 230, 215, .14);
      border-radius: 5px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(200, 230, 215, .26);
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    button {
      font-family: inherit;
    }

    /* ============ 顶栏 ============ */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 56px;
      padding: 0 24px;
      background: rgba(20, 26, 23, .85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line-2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 品牌头像：透明底 PNG（data URI），六边形容器 + 淡绿辉光 */
    .avatar {
      width: 34px;
      height: 39px;
      flex: none;
      background: var(--klein-avatar) center / cover no-repeat;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      filter: drop-shadow(0 0 6px rgba(78, 217, 160, .3));
    }

    .brand-text h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .3em;
      line-height: 1.15;
      color: var(--text);
    }

    .brand-sub {
      display: block;
      margin-top: 1px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .14em;
      color: var(--faint);
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 14px;
      letter-spacing: .03em;
      cursor: pointer;
      transition: filter .15s, box-shadow .15s, background .15s, border-color .15s, transform .06s;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* 主按钮用近白高对比，绿色只留给辉光，避免满屏绿 */
    .btn.primary {
      background: #e9f5ef;
      border: 1px solid transparent;
      color: #0a1512;
      font-weight: 600;
    }

    .btn.primary:hover {
      background: #ffffff;
      box-shadow: 0 0 22px rgba(78, 217, 160, .22);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--muted);
    }

    .btn.ghost:hover {
      color: var(--text);
      border-color: rgba(200, 230, 215, .3);
      background: rgba(200, 230, 215, .04);
    }

    .btn.ghost svg {
      transform: rotate(-35deg);
    }

    /* ============ 控制台骨架：侧边导航 + 内容面板 ============ */

    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      max-width: 1220px;
      margin: 56px auto 0;
      min-height: calc(100vh - 56px);
    }

    #sideNav {
      flex: none;
      width: 232px;
      position: sticky;
      top: 56px;
      align-self: flex-start;
      height: calc(100vh - 56px);
      overflow-y: auto;
      padding: 22px 14px 30px;
      border-right: 1px solid var(--line);
      counter-reset: nav;
    }

    .nav-label {
      /* 中文不走 --mono：等宽栈无中文字形，小字号回退渲染发虚 */
      font-size: 12px;
      letter-spacing: .25em;
      color: var(--muted);
      padding: 0 12px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s, background .15s;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(200, 230, 215, .05);
    }

    .nav-item.active {
      color: var(--text);
      background: var(--mint-soft);
      box-shadow: inset 2px 0 0 var(--mint);
    }

    .nav-item .code {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--faint);
      flex: none;
      min-width: 26px;
    }

    .nav-item.active .code {
      color: var(--mint);
    }

    .nav-item .code::before {
      counter-increment: nav;
      content: "M" counter(nav, decimal-leading-zero);
    }

    .nav-item svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .nav-sep {
      height: 1px;
      background: var(--line);
      margin: 12px 6px;
    }

    /* 配置版本只读标识：模型供应商下方展示，纯状态芯片、不可点击
       （改动请直接编辑 config.json，面板保存时会原样写回该值） */
    .nav-version {
      margin: 10px 6px 2px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      box-shadow: inset 2px 0 0 var(--mint);
      font-size: 12px;
      letter-spacing: .06em;
      color: var(--muted);
      text-align: left;
      white-space: nowrap;
      cursor: default;
      user-select: none;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 30px 40px 90px;
      max-width: 780px;
    }

    /* ============ 内容面板 ============ */

    .pane {
      display: none;
    }

    .pane.active {
      display: block;
      animation: pane-in .18s ease;
    }

    @keyframes pane-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    .pane h2 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .pane-hint {
      margin: 0 0 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    #banner {
      display: none;
      margin-bottom: 20px;
      padding: 12px 16px;
      border: 1px solid var(--line-2);
      border-left: 3px solid var(--mint);
      border-radius: 0 10px 10px 0;
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: var(--text);
    }

    #banner::before {
      display: block;
      font-weight: 700;
      letter-spacing: .12em;
      margin-bottom: 4px;
      color: var(--mint);
    }

    #banner.ok {
      display: block;
      animation: pane-in .2s ease;
    }

    #banner.ok::before {
      content: "[ LAB · OK ]";
    }

    #banner.err {
      display: block;
      border-left-color: var(--danger);
      animation: pane-in .2s ease;
    }

    #banner.err::before {
      content: "[ LAB · ERR ]";
      color: var(--danger);
    }

    .note {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-left: 2px solid var(--line-2);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ============ 子模块（配置子对象）============ */

    .fields {
      counter-reset: module;
    }

    details.section {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 14px;
      background: var(--surface-2);
    }

    details.section>summary {
      padding: 12px 44px 12px 16px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .03em;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      list-style: none;
      border-radius: 12px 12px 0 0;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    details.section>summary::before {
      counter-increment: module;
      content: "M" counter(module, decimal-leading-zero);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--faint);
      margin-right: 10px;
    }

    details.section[open]>summary::before {
      color: var(--mint);
    }

    details.section::after {
      content: "+";
      position: absolute;
      top: 10px;
      right: 15px;
      font-family: var(--mono);
      font-size: 15px;
      color: var(--faint);
      transition: color .2s;
    }

    details.section[open]::after {
      content: "−";
      color: var(--mint);
    }

    details.section .row:last-child,
    .provider .row:last-child,
    .transport-card .row:last-child {
      border-radius: 0 0 12px 12px;
    }

    /* ============ OneBot 通信：类型驱动卡片 ============ */

    .transport-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 14px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .transport-card>.row:first-child {
      border-top: 0;
    }

    .row-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    /* HTTP 形态的两组子字段（API 调用 / 事件上报）的分组标题 */
    .group-label {
      padding: 14px 16px 6px 20px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--mint);
    }

    [data-hint] {
      position: relative;
    }

    .row label[data-hint] {
      cursor: help;
    }

    [data-hint]::after {
      content: attr(data-hint);
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 6px;
      background: #1e2823;
      color: #dceee4;
      padding: 8px 12px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.65;
      white-space: normal;
      width: max-content;
      max-width: 380px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease .25s, visibility .12s ease .25s;
    }

    [data-hint]:hover::after {
      opacity: 1;
      visibility: visible;
    }

    .row {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 8px 18px;
      align-items: center;
      padding: 11px 16px 11px 20px;
      border-top: 1px solid var(--line);
    }

    .row:hover {
      background: rgba(200, 230, 215, .02);
    }

    .row label {
      font-size: 14.5px;
      color: var(--muted);
    }

    .row label .path {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: .02em;
      color: var(--faint);
      display: block;
      margin-top: 2px;
      font-weight: 400;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #4e5e56;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(78, 217, 160, .13);
    }

    input.invalid,
    textarea.invalid {
      border-color: #f87171;
      background: rgba(248, 113, 113, .05);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, .12);
    }

    input[type=checkbox] {
      width: 18px;
      height: 18px;
      accent-color: var(--mint);
    }

    textarea {
      min-height: 80px;
    }

    select option {
      background: var(--surface);
    }

    /* ============ 供应商 ============ */

    .provider {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 14px;
      background: var(--surface-2);
    }

    .provider-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px 13px 18px;
      border-bottom: 1px solid var(--line);
      border-radius: 12px 12px 0 0;
      background: rgba(200, 230, 215, .025);
      font-family: var(--mono);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: .02em;
      color: var(--text);
    }

    .provider-head::before {
      content: "◈";
      color: var(--mint);
      font-size: 11px;
      margin-right: 2px;
    }

    .remove {
      flex: none;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--faint);
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: color .15s, background .15s, border-color .15s;
    }

    .remove:hover {
      color: var(--danger);
      background: rgba(248, 113, 113, .1);
      border-color: rgba(248, 113, 113, .3);
    }

    .models-toolbar {
      display: flex;
      margin-bottom: 14px;
    }

    /* 卡片头部：describe 标题 + 模型数统计 + 图标化删除 */
    .provider-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .provider-meta {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .provider-count {
      flex: none;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .05em;
      color: var(--muted);
      border: 1px solid var(--line-2);
      background: rgba(200, 230, 215, .03);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }

    .provider-count strong {
      color: var(--mint);
      font-weight: 600;
      margin-right: 1px;
    }

    .provider-count.empty {
      color: var(--faint);
      border-style: dashed;
    }

    /* 模型 chips：卡片的视觉主体 */
    .model-zone {
      position: relative;
      min-width: 0;
      background: rgba(200, 230, 215, .03);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
    }

    .model-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .model-chips:empty::after {
      content: "尚未选择模型";
      font-size: 12.5px;
      color: var(--faint);
      border: 1px dashed var(--line-2);
      border-radius: 8px;
      padding: 6px 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 13px;
      color: #d9f4e7;
      background: rgba(78, 217, 160, .08);
      border: 1px solid rgba(78, 217, 160, .3);
      border-radius: 8px;
      padding: 5px 6px 5px 11px;
      max-width: 100%;
      transition: border-color .15s, background .15s;
    }

    .chip:hover {
      border-color: rgba(78, 217, 160, .45);
      background: rgba(78, 217, 160, .11);
    }

    .chip>span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip-x {
      flex: none;
      border: 0;
      background: transparent;
      color: rgba(217, 244, 231, .5);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 50%;
      transition: color .15s, background .15s;
    }

    .chip-x:hover {
      color: var(--danger);
      background: rgba(248, 113, 113, .14);
    }

    /* chip 上的视觉标注切换：◉=已标注支持视觉输入 */
    .chip-vision {
      flex: none;
      border: 0;
      background: transparent;
      color: rgba(217, 244, 231, .4);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color .15s, background .15s;
    }

    .chip-vision:hover {
      color: #d9f4e7;
      background: rgba(217, 244, 231, .08);
    }

    .chip-vision.on {
      color: var(--mint);
    }

    .chip-vision.on:hover {
      color: #8aebc2;
    }

    .model-note {
      font-size: 12.5px;
      color: var(--muted);
    }

    .model-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 9px;
    }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      padding: 5px 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s, box-shadow .15s;
    }

    .mini-btn:hover {
      color: var(--mint);
      border-color: rgba(78, 217, 160, .45);
      box-shadow: 0 0 12px rgba(78, 217, 160, .08);
    }

    .mini-btn:disabled {
      opacity: .55;
      cursor: default;
      pointer-events: none;
    }

    .model-error {
      font-size: 12.5px;
      color: var(--danger);
    }

    .model-manual {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .model-manual[hidden] {
      display: none;
    }

    .model-manual input {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 13px;
    }

    /* ============ 自绘下拉与模型勾选浮层 ============ */

    .combo {
      position: relative;
    }

    .combo-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    .combo-btn:hover {
      border-color: rgba(78, 217, 160, .3);
    }

    .combo.open .combo-btn,
    .combo-btn:focus-visible {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(78, 217, 160, .13);
    }

    .combo-caret {
      color: var(--faint);
      font-size: 11px;
      transition: transform .15s;
    }

    .combo.open .combo-caret {
      transform: rotate(180deg);
    }

    .combo-pop,
    .model-pick {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 60;
      background: #1e2823;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity .12s ease, transform .12s ease, visibility .12s;
    }

    .combo-pop {
      right: 0;
      padding: 5px;
    }

    .model-pick {
      width: max-content;
      min-width: min(340px, 100%);
      max-width: min(480px, calc(100vw - 120px));
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    .combo.open .combo-pop,
    .model-zone.open .model-pick {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .combo-opt,
    .pick-opt {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      transition: background .1s;
    }

    .combo-opt:hover,
    .combo-opt:focus-visible,
    .pick-opt:hover,
    .pick-opt:focus-visible {
      background: rgba(200, 230, 215, .06);
      outline: none;
    }

    .combo-opt .tick,
    .pick-opt .tick {
      color: var(--mint);
      font-size: 11px;
      visibility: hidden;
    }

    .combo-opt.selected,
    .pick-opt.selected {
      color: var(--mint);
    }

    .combo-opt.selected .tick,
    .pick-opt.selected .tick {
      visibility: visible;
    }

    .pick-opt {
      font-family: var(--mono);
      font-size: 13px;
    }

    .pick-opt>span:not(.tick) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-pick-list {
      max-height: 264px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;

      height: 74px;
      margin: 0 auto;
      filter: drop-shadow(0 0 10px rgba(78, 217, 160, .25));

      margin: 0;
      font-size: 17px;
      letter-spacing: .12em;
    }

    #login p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    #login p.flavor {
      font-size: 13px;
      font-style: italic;
      color: var(--faint);
    }

    #login input {
      text-align: center;
    }

    #loginError {
      margin: 0;
      min-height: 17px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--danger);
    }

    #login .card.shake {
      animation: login-shake .32s ease;
    }

    @keyframes login-shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(3px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-5px);
      }

      40%,
      60% {
        transform: translateX(5px);
      }
    }

    .btn.wide {
      width: 100%;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .03em;
      line-height: 1.9;
      color: var(--faint);
    }

    footer .tagline {
      display: block;
      margin-top: 4px;
      color: #5c6e64;
    }

    /* ============ 响应式与可访问性 ============ */

    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
      }

      #sideNav {
        position: sticky;
        top: 56px;
        width: 100%;
        height: auto;
        display: flex;

        gap: 4px;
        overflow-x: auto;
        padding: 10px 16px;

      }

      .nav-item {
        width: auto;
        white-space: nowrap;

      }

      .nav-item .code {
        display: none;
      }

      .content {
        padding: 22px 18px 70px;
      }
    }

    @media (max-width: 640px) {
      .brand-sub {
        display: none;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

</head>

    // 已废弃字段：不渲染、保存时随收集自然消失（旧配置残留值不再显示为可编辑项）
    const HIDDEN_KEYS = {

    function orderedEntries(object, sectionKey) {
      const order = sectionKey === null ? SECTION_ORDER : SECTION_KEY_ORDER[sectionKey];
      const hidden = HIDDEN_KEYS[sectionKey] || [];
      if (!order)
        return Object.entries(object).filter(([key]) => hidden.indexOf(key) < 0);
      const known = [];
      for (const key of order)
        if (hidden.indexOf(key) < 0 && Object.prototype.hasOwnProperty.call(object, key))
          known.push([key, object[key]]);
      const rest = Object.entries(object)
        .filter(([key]) => order.indexOf(key) < 0 && hidden.indexOf(key) < 0);
      return known.concat(rest);
    }

      const communication = config && typeof config === "object" ? config.communication : null;
      const transports = communication && typeof communication === "object"

      transportOptions = Object.keys(transports).map((key) => {
        const profile = transports[key];
        const type = profile !== null && typeof profile === "object" && !Array.isArray(profile)
          ? (profile.type || "") : "";
        return { value: key, label: transportLabelFor(type) + "（" + key + "）" };
      });
    }

    function transportSelectOptions(currentValue) {
      const current = currentValue === null || currentValue === undefined ? "" : String(currentValue);
      const options = transportOptions.slice();
      options.unshift({ value: "", label: "（未设置）" });
      // 悬空引用的配置无法启动面板，这里仅作兜底：避免意外场景下保存丢值
      if (current !== "" && !options.some((option) => option.value === current))
        options.push({ value: current, label: current + "（当前值）" });
      return options;
    }

    /* ---------- OneBot 通信：类型驱动的专用视图 ----------
       选择连接方式（传输类型）后只渲染该类型的字段；编辑始终作用在
       communication.transports 里当前启用的档案上，切换类型时启用同类型
       的既有档案（不存在则按默认值新建），其余档案原样保留。 */

    // 字段集合与 ConfigLoader 对各类型 Profile 的校验一一对应
    const TRANSPORT_FIELD_SETS = {
      forward_websocket: {
        modeLabel: "正向 WebSocket",
        modeDetail: "Klein 主动连接协议端",
        fields: [
          {
            key: "host", label: "服务器地址", kind: "string",
            hint: "OneBot 协议端（NapCat / LagRange 等）的地址，Klein 主动连接它。"
          },
          {
            key: "port", label: "端口", kind: "int",
            hint: "协议端正向 WebSocket 的监听端口，1~65535。"
          },
          { key: "path", label: "路径", kind: "string" },
          { key: "access_token", label: "访问令牌", kind: "secret" }
        ]
      },
      reverse_websocket: {
        modeLabel: "反向 WebSocket",
        modeDetail: "协议端主动连入 Klein",
        fields: [
          { key: "bind", label: "监听地址", kind: "string" },
          {
            key: "port", label: "端口", kind: "int",
            hint: "Klein 的监听端口，协议端反向连接这里。"
          },
          { key: "path", label: "路径", kind: "string" },
          { key: "access_token", label: "访问令牌", kind: "secret" }
        ]
      },
      http: {
        modeLabel: "HTTP",
        modeDetail: "API 调用 + 事件上报",
        groups: [
          {
            title: "API 调用（Klein → 协议端）", sub: "api",
            fields: [
              { key: "base_url", label: "API 地址", kind: "string" },
              { key: "access_token", label: "访问令牌", kind: "secret" }
            ]
          },
          {
            title: "事件上报（协议端 → Klein）", sub: "events",
            fields: [
              { key: "bind", label: "监听地址", kind: "string" },
              {
                key: "port", label: "端口", kind: "int",
                hint: "Klein 监听事件上报的端口。"
              },
              { key: "path", label: "路径", kind: "string" },
              { key: "access_token", label: "访问令牌", kind: "secret" },
              { key: "secret", label: "上报签名密钥", kind: "secret" }
            ]
          }
        ]
      }
    };
    const TRANSPORT_DEFAULTS_KEYS = [
      { key: "connect_timeout_ms", label: "连接超时（ms）", fallback: 5000 },
      { key: "request_timeout_ms", label: "请求超时（ms）", fallback: 15000 },
      { key: "max_event_body_bytes", label: "事件体积上限（字节）", fallback: 1048576 }
    ];

    let communicationDraft = null;       // 深拷贝的原配置，编辑与保存都叠加在其上
    let communicationAutoCreated = null; // 本会话切换类型时自动创建的档案键
    let communicationFields = null;      // 通信面板的 .fields 容器，切类型时整块重绘

    function isPlainObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    // 新建档案的初始值：对齐 ConfigTemplate 与常见协议端默认，仅作可编辑占位
    function defaultTransportProfile(type) {
      if (type === "forward_websocket")
        return { type: type, host: "127.0.0.1", port: 3001, path: "/", access_token: "" };
      if (type === "reverse_websocket")
        return { type: type, bind: "127.0.0.1", port: 8600, path: "/onebot", access_token: "" };
      return {
        type: "http",
        api: { base_url: "http://127.0.0.1:3000", access_token: "" },
        events: { bind: "127.0.0.1", port: 3002, path: "/onebot/events", access_token: "", secret: "" }
      };
    }

    function transportInputFor(field, value) {
      let input;
      if (field.kind === "secret") {
        input = document.createElement("input");
        input.type = "password";
        input.placeholder = "留空保持原值（已掩码）";
        input.dataset.kind = "secret";
        input.dataset.original = typeof value === "string" ? value : SENTINEL;
        input.autocomplete = "new-password";
      } else if (field.kind === "int") {
        input = document.createElement("input");
        input.type = "number";
        input.step = "1";
        input.value = Number.isFinite(value) ? value : "";
        input.dataset.kind = "number";
        input.dataset.int = "1";
        input.dataset.original = Number.isFinite(value) ? String(value) : "0";
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = value === undefined || value === null ? "" : String(value);
        input.dataset.kind = "null";
        input.dataset.original = value === null ? "null" : String(value === undefined ? "" : value);
      }
      return input;
    }

    // target 是相对 communication 根的键数组（JSON 序列化挂在 dataset 上），
    // 避免档案名里出现“.”时按路径字符串拆分写错位置；path 仅用于展示与后端诊断定位
    function transportFieldRow(field, value, path, target) {
      const row = rowFor(path, field.label, field.hint || FIELD_HINTS[path] || KEY_HINTS[field.key] || "");
      const input = transportInputFor(field, value);
      input.dataset.path = path;
      input.dataset.target = JSON.stringify(target);
      row.appendChild(input);
      return row;
    }

    function renderCommunicationFields() {
      const container = communicationFields;
      container.textContent = "";
      const draft = communicationDraft;
      const activeKey = draft.active_transport;
      const profile = draft.transports[activeKey];
      const type = profile.type;
      const fieldSet = TRANSPORT_FIELD_SETS[type];
      const defaults = defaultTransportProfile(type);
      const profilePath = "communication.transports." + activeKey;
      const valueFor = (source, fallbackSource, field) =>
        source[field.key] !== undefined && source[field.key] !== null
          ? source[field.key] : fallbackSource[field.key];

      const card = document.createElement("div");
      card.className = "transport-card";

      const modeRow = document.createElement("div");
      modeRow.className = "row";
      const modeLabel = document.createElement("label");
      modeLabel.innerHTML = '连接方式<span class="path"></span>';
      modeLabel.querySelector(".path").textContent = "communication.active_transport";
      modeLabel.dataset.hint =
        "选择与协议端的连接形态，下方仅显示该形态的字段；切换会启用对应档案（不存在时按默认值新建）。改动需重启生效。";
      const control = document.createElement("div");
      control.className = "row-control";
      const select = document.createElement("select");
      select.dataset.path = "communication.active_transport";
      for (const key of Object.keys(TRANSPORT_FIELD_SETS)) {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = TRANSPORT_FIELD_SETS[key].modeLabel;
        if (key === type) option.selected = true;
        select.appendChild(option);
      }
      select.addEventListener("change", () => switchTransportType(select.value));
      // 详细说明放下拉下方两行提示里，选项本身保持短标签
      const detailHint = document.createElement("div");
      detailHint.className = "hint";
      detailHint.textContent = fieldSet.modeLabel + "：" + fieldSet.modeDetail;
      const activeHint = document.createElement("div");
      activeHint.className = "hint";
      activeHint.textContent = "当前档案：" + activeKey + "；未显示的其他档案仍保留在配置文件中。";
      control.appendChild(select);
      control.appendChild(detailHint);
      control.appendChild(activeHint);
      modeRow.appendChild(modeLabel);
      modeRow.appendChild(control);
      card.appendChild(modeRow);

      if (fieldSet.fields) {
        for (const field of fieldSet.fields)
          card.appendChild(transportFieldRow(field, valueFor(profile, defaults, field),
            profilePath + "." + field.key, ["transports", activeKey, field.key]));
      } else {
        for (const group of fieldSet.groups) {
          const label = document.createElement("div");
          label.className = "group-label";
          label.textContent = group.title;
          card.appendChild(label);
          const source = isPlainObject(profile[group.sub]) ? profile[group.sub] : {};
          const fallback = defaults[group.sub];
          for (const field of group.fields)
            card.appendChild(transportFieldRow(field, valueFor(source, fallback, field),
              profilePath + "." + group.sub + "." + field.key,
              ["transports", activeKey, group.sub, field.key]));
        }
      }
      container.appendChild(card);

      const advanced = document.createElement("details");
      advanced.className = "section";
      const summary = document.createElement("summary");
      summary.textContent = "高级参数";
      summary.dataset.hint = "通信超时与事件体积上限，一般无需调整。";
      advanced.appendChild(summary);
      const advancedFields = document.createElement("div");
      advancedFields.className = "fields";
      advanced.appendChild(advancedFields);
      const defaultValues = isPlainObject(draft.defaults) ? draft.defaults : {};
      for (const spec of TRANSPORT_DEFAULTS_KEYS)
        advancedFields.appendChild(transportFieldRow(
          { key: spec.key, label: spec.label, kind: "int" },
          defaultValues[spec.key] !== undefined && defaultValues[spec.key] !== null
            ? defaultValues[spec.key] : spec.fallback,
          "communication.defaults." + spec.key, ["defaults", spec.key]));
      container.appendChild(advanced);
    }

    function switchTransportType(type) {
      if (!TRANSPORT_FIELD_SETS[type] || !communicationDraft) return;
      const transports = communicationDraft.transports;
      let key = Object.keys(transports).find(
        (candidate) => isPlainObject(transports[candidate]) && transports[candidate].type === type);
      if (key === undefined) {
        key = type;
        for (let suffix = 2; Object.prototype.hasOwnProperty.call(transports, key); suffix++)
          key = type + "-" + suffix;
        transports[key] = defaultTransportProfile(type);
        communicationAutoCreated.add(key);
      }
      communicationDraft.active_transport = key;
      renderCommunicationFields();
    }

    // 通信面板入口：结构可识别时接管渲染，返回 false 则退回通用渲染
    function buildCommunicationPane(pane, communication) {
      if (!isPlainObject(communication) || !isPlainObject(communication.transports)) return false;
      const activeKey = typeof communication.active_transport === "string"
        ? communication.active_transport : "";
      const profile = communication.transports[activeKey];
      if (!isPlainObject(profile)) return false;
      const type = typeof profile.type === "string" ? profile.type : "";
      if (!TRANSPORT_FIELD_SETS[type]) return false;
      communicationDraft = JSON.parse(JSON.stringify(communication));
      communicationAutoCreated = new Set();
      pane.dataset.custom = "communication";
      communicationFields = pane.querySelector(".fields");
      renderCommunicationFields();
      return true;
    }

    function collectCommunicationPane(pane) {
      for (const input of pane.querySelectorAll("[data-target]")) {
        let keys;
        try { keys = JSON.parse(input.dataset.target); } catch { continue; }
        let node = communicationDraft;
        for (let index = 0; index < keys.length - 1; index++) {
          if (!isPlainObject(node[keys[index]])) node[keys[index]] = {};
          node = node[keys[index]];
        }
        node[keys[keys.length - 1]] = valueFromInput(input);
      }
      // 切换类型时自动创建、最终又未被选中的原型档案不落盘
      for (const key of communicationAutoCreated) {
        if (key === communicationDraft.active_transport) continue;
        const profile = communicationDraft.transports[key];
        if (isPlainObject(profile) &&
          JSON.stringify(profile) === JSON.stringify(defaultTransportProfile(profile.type)))
          delete communicationDraft.transports[key];
      }
      return communicationDraft;
    }

    function label(key, isSection) {
      if (isSection && SECTION_LABELS[key]) return SECTION_LABELS[key];
      return KEY_LABELS[key] || key;
    }

    /* ---------- 通用 ---------- */

    async function request(path, options) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (token()) headers["Authorization"] = "Bearer " + token();
      const response = await fetch(path, Object.assign({}, options, { headers }));
      if (response.status === 401) { $("login").style.display = "flex"; throw new Error("unauthorized"); }
      return response;
    }

    function showBanner(text, isError) {
      const banner = $("banner");
      banner.textContent = text;
      banner.className = isError ? "err" : "ok";
    }

    function diagnosticsText(items) {
      return (items || []).map((d) => d.severity + " " + d.path + " - " + d.message).join("\n");
    }

    function clearMarks() {
      for (const input of document.querySelectorAll(".invalid")) {
        input.classList.remove("invalid");
        input.title = "";
      }
    }

    /* ---------- 主配置：侧边导航 + 面板 ---------- */

    function navItem(key, name) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "nav-item";
      item.dataset.key = key;
      const code = document.createElement("span");
      code.className = "code";
      const text = document.createElement("span");
      text.textContent = name;
      item.appendChild(code);
      item.appendChild(text);
      item.addEventListener("click", () => selectPane(key));
      return item;
    }

    function modelsNavItem() {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "nav-item";
      item.dataset.key = MODELS_KEY;
      item.innerHTML =
        '<svg viewBox="0 0 16 16" aria-hidden="true">' +
        '<g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">' +
        '<path d="M3 8 H0.9 M0.9 5.4 V10.6 M3 5.2 H10.4 V10.8 H3 Z M10.4 8 H15 M5.2 5.2 V7.4 M7.4 5.2 V7.4"/>' +
        '</g></svg><span>模型供应商</span>';
      item.addEventListener("click", () => selectPane(MODELS_KEY));
      return item;
    }

    function selectPane(key) {
      activePane = key;
      for (const item of document.querySelectorAll(".nav-item"))
        item.classList.toggle("active", item.dataset.key === key);
      for (const pane of document.querySelectorAll(".pane"))
        pane.classList.toggle("active", pane.dataset.key === key);
      $("modelsView").style.display = key === MODELS_KEY ? "" : "none";
      if (key === MODELS_KEY && !modelsLoaded) loadModels();
      $("banner").className = "";
    }

    function rowFor(path, labelText, hint) {
      const row = document.createElement("div");
      row.className = "row";
      const labelElement = document.createElement("label");
      labelElement.innerHTML = labelText.replace(/</g, "&lt;") + '<span class="path"></span>';
      labelElement.querySelector(".path").textContent = path;
      if (hint) labelElement.dataset.hint = hint;
      row.appendChild(labelElement);
      return row;
    }

    function renderValue(parent, key, value, path, isSection) {
      if (value !== null && typeof value === "object" && !Array.isArray(value)) {
        const section = document.createElement("details");
        section.className = "section";
        section.dataset.key = key;
        if (isSection) section.open = true;
        const summary = document.createElement("summary");
        summary.textContent = label(key, true);
        if (SECTION_HINTS[key]) summary.dataset.hint = SECTION_HINTS[key];
        section.appendChild(summary);
        const fields = document.createElement("div");
        fields.className = "fields";
        section.appendChild(fields);
        for (const [childKey, childValue] of orderedEntries(value, key))
          renderValue(fields, childKey, childValue, path ? path + "." + childKey : childKey, false);
        parent.appendChild(section);
        return;
      }

      const row = rowFor(path, label(key, false), hintFor(path, key));
      let input;
      if (path === "communication.active_transport") {
        // 字段特例：传输形态是"从 transports 集合中选一个"，下拉避免拼写错误
        input = document.createElement("select");
        const current = value === null || value === undefined ? "" : String(value);
        for (const option of transportSelectOptions(current)) {
          const element = document.createElement("option");
          element.value = option.value;
          element.textContent = option.label;
          if (option.value === current)
            element.selected = true;
          input.appendChild(element);
        }
      } else if (key === "api_standard" && API_STANDARDS.includes(value)) {
        // 字段特例：合法值只有 OpenAI/Anthropic（与模型供应商页一致用自绘下拉）；
        // 留空或非法值仍走文本框，保留原样可编辑，不做静默改写
        input = createComboSelect(API_STANDARDS, value);
        input.dataset.kind = "null";
        input.dataset.original = String(value);
      } else if (Array.isArray(value)) {
        input = document.createElement("textarea");
        input.value = JSON.stringify(value, null, 2);
        input.dataset.kind = "json";
      } else if (typeof value === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = value;
        input.dataset.kind = "bool";
      } else if (typeof value === "number") {
        input = document.createElement("input");
        input.type = "number";
        input.step = "any";
        input.value = value;
        input.dataset.kind = "number";
        input.dataset.int = Number.isInteger(value) ? "1" : "";
        input.dataset.original = String(value);
      } else if (SECRET_KEYS.has(key)) {
        input = document.createElement("input");
        input.type = "password";
        input.placeholder = "留空保持原值（已掩码）";
        input.dataset.kind = "secret";
        input.dataset.original = typeof value === "string" ? value : SENTINEL;
        input.autocomplete = "new-password";
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = value === null ? "" : value;
        input.dataset.kind = "null";
        input.dataset.original = value === null ? "null" : String(value);
      }
      input.dataset.path = path;
      row.appendChild(input);
      parent.appendChild(row);
    }

    // 输入控件 → JSON 值：通用渲染与通信专用视图共用同一套转换
    function valueFromInput(input) {
      const kind = input.dataset.kind;
      if (kind === "bool") return input.checked;
      if (kind === "secret") return input.value === "" ? input.dataset.original : input.value;
      if (kind === "number") {
        let raw = input.value;
        if (raw === "") raw = input.dataset.original;
        const number = input.dataset.int === "1" ? Number.parseInt(raw, 10) : Number.parseFloat(raw);
        return Number.isNaN(number) ? Number(input.dataset.original) : number;
      }
      if (kind === "json") {
        try { return JSON.parse(input.value || "[]"); }
        catch { input.classList.add("invalid"); input.title = "JSON 解析失败"; return null; }
      }
      const original = input.dataset.original;
      return input.value === "" && original === "null" ? null : input.value;
    }

    function collectFrom(container) {
      const result = {};
      for (const child of container.children) {
        if (child.classList.contains("section")) {
          result[child.dataset.key] = collectFrom(child.querySelector(".fields"));
          continue;
        }
        // .combo 是自绘下拉（无 input 元素），暴露同名 .value，收集逻辑与输入框一致
        const input = child.querySelector("input, textarea, select, .combo");
        if (!input || !input.dataset.path) continue;
        result[input.dataset.path.split(".").pop()] = valueFromInput(input);
      }
      return result;
    }

    function collectConfig() {
      const result = {};
      if (loadedSchemaVersion !== undefined)
        result.schema_version = loadedSchemaVersion;
      for (const pane of $("panes").children) {
        if (pane.dataset.custom === "communication" && communicationDraft) {
          result[pane.dataset.key] = collectCommunicationPane(pane);
          continue;
        }
        const inner = collectFrom(pane.querySelector(".fields"));
        if (pane.dataset.mergeInto) {
          // 展示在独立模块、但属于原分组的字段（功能开关 → bot）
          const target = result[pane.dataset.mergeInto] || (result[pane.dataset.mergeInto] = {});
          Object.assign(target, inner);
          continue;
        }
        result[pane.dataset.key] = pane.dataset.scalar === "1"
          ? inner[pane.dataset.key] : inner;
      }
      return result;
    }

    function markFields(diagnostics) {
      for (const diagnostic of diagnostics) {
        const input = document.querySelector('[data-path="' + diagnostic.path + '"]');
        if (input) { input.classList.add("invalid"); input.title = diagnostic.message; }
      }
    }

    function showSaveResult(body) {
      const counts = body.counts || {};
      const total = (counts.dynamic || 0) + (counts.rebuild || 0) + (counts.restart || 0);
      let text = "已保存并刷新内存快照。" +
        "变更 " + total + " 项（动态 " + (counts.dynamic || 0) +
        "、需重建 " + (counts.rebuild || 0) + "、需重启 " + (counts.restart || 0) + "）。";
      const groups = {};
      for (const change of body.diff || [])
        (groups[change.impact] = groups[change.impact] || []).push(change.path);
      for (const impact of ["restart", "rebuild"]) {
        const paths = groups[impact];
        if (paths && paths.length)
          text += "\n【" + IMPACT_LABELS[impact] + "】" + paths.join("、");
      }
      if (counts.restart > 0) text += "\n需重启的项要重启机器人后才会生效。";
      const extra = (body.diagnostics || []).concat(body.warnings || []);
      if (extra.length) text += "\n诊断：" + diagnosticsText(extra);
      showBanner(text, false);
    }

    // “功能开关”模块：展示上独立成区，保存时经 mergeInto 写回 bot 分组，
    // 配置文件结构保持不变（仍是 bot.group_chat_enabled）
    function featureTogglesPane(bot) {
      const pane = document.createElement("section");
      pane.className = "pane";
      pane.dataset.key = "features";
      pane.dataset.mergeInto = "bot";
      const heading = document.createElement("h2");
      heading.textContent = SECTION_LABELS.features;
      pane.appendChild(heading);
      const hint = document.createElement("p");
      hint.className = "pane-hint";
      hint.textContent = SECTION_HINTS.features || "";
      pane.appendChild(hint);
      const fields = document.createElement("div");
      fields.className = "fields";
      pane.appendChild(fields);
      const path = "bot.group_chat_enabled";
      const row = rowFor(path, KEY_LABELS.group_chat_enabled || "启用群聊", hintFor(path, "group_chat_enabled"));
      const input = document.createElement("input");
      input.type = "checkbox";
      // 键缺失视为开启（与 ConfigLoader 默认一致），保存时会显式落盘
      input.checked = bot.group_chat_enabled !== false;
      input.dataset.kind = "bool";
      input.dataset.path = path;
      row.appendChild(input);
      fields.appendChild(row);
      return pane;
    }

    async function loadConfig() {
      try {
        const response = await request("/api/config", { method: "GET" });
        if (!response.ok) { showBanner("读取配置失败：HTTP " + response.status, true); return; }
        const document_ = await response.json();
        extractTransportOptions(document_);
        const nav = $("sideNav");
        nav.textContent = "";
        const navLabel = document.createElement("div");
        navLabel.className = "nav-label";
        navLabel.textContent = "配置模块";
        nav.appendChild(navLabel);
        const panes = $("panes");
        panes.textContent = "";
        let firstKey = "";
        // schema_version 不是可编辑项：不生成分区，只在侧边导航底部展示原值，
        // 保存时由 collectConfig 写回（改版本号请直接编辑 config.json）
        loadedSchemaVersion = typeof document_.schema_version === "number"
          ? document_.schema_version : undefined;
        for (const [key, value] of orderedEntries(document_, null)) {
          if (key === "schema_version") continue;
          if (!firstKey) firstKey = key;
          nav.appendChild(navItem(key, label(key, true)));
          const pane = document.createElement("section");
          pane.className = "pane";
          pane.dataset.key = key;
          const heading = document.createElement("h2");
          heading.textContent = label(key, true);
          pane.appendChild(heading);
          const hint = document.createElement("p");
          hint.className = "pane-hint";
          hint.textContent = SECTION_HINTS[key] || "";
          pane.appendChild(hint);
          const fields = document.createElement("div");
          fields.className = "fields";
          pane.appendChild(fields);
          // 未知顶层标量没有子对象，直接渲染成行并打上
          // scalar 标记：collectConfig 按此解包，避免 collectFrom 再包一层
          if (isPlainObject(value)) {
            // communication 是唯一的顶层特例：类型驱动的专用视图；
            // 结构无法识别（活动档案悬空、未知类型等）时退回通用渲染
            // bot 分组只展示身份字段，群聊开关挪进紧随其后的“功能开关”模块
            const skipKeys = key === "bot" ? new Set(["group_chat_enabled"]) : null;
            if (!(key === "communication" && buildCommunicationPane(pane, value)))
              for (const [childKey, childValue] of orderedEntries(value, key))
                if (!skipKeys || !skipKeys.has(childKey))
                  renderValue(fields, childKey, childValue, key + "." + childKey, false);
          } else {
            pane.dataset.scalar = "1";
            renderValue(fields, key, value, key, false);
          }
          panes.appendChild(pane);
          if (key === "bot" && isPlainObject(value)) {
            nav.appendChild(navItem("features", SECTION_LABELS.features));
            panes.appendChild(featureTogglesPane(value));
          }
        }
        const sep = document.createElement("div");
        sep.className = "nav-sep";
        nav.appendChild(sep);
        nav.appendChild(modelsNavItem());
        const versionChip = document.createElement("div");
        versionChip.className = "nav-version";
        if (loadedSchemaVersion === undefined)
          versionChip.hidden = true;
        else
          versionChip.textContent = "配置文件版本 v" + loadedSchemaVersion;
        nav.appendChild(versionChip);
        const known = activePane === MODELS_KEY ||
          document.querySelectorAll('.pane[data-key="' + activePane + '"]').length > 0;
        selectPane(known && activePane ? activePane : (firstKey || MODELS_KEY));
        $("banner").className = "";
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    async function saveConfig() {
      clearMarks();
      const candidate = collectConfig();
      try {
        const response = await request("/api/config", { method: "POST", body: JSON.stringify(candidate) });
        const body = await response.json();
        if (response.status === 422) {
          markFields(body.diagnostics || []);
          showBanner("保存被拒绝（" + (body.diagnostics || []).length + " 条诊断）：\n" +
            diagnosticsText(body.diagnostics), true);
          return;
        }
        if (!response.ok) { showBanner("保存失败：HTTP " + response.status, true); return; }
        showSaveResult(body);
        await loadConfig();
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    /* ---------- 模型供应商视图 ---------- */

    function providerRow(labelText, hint, input) {
      const row = document.createElement("div");
      row.className = "row";

      labelElement.textContent = labelText;

    // 自绘下拉：原生 select 的展开列表由系统绘制，无法适配终端主题
    function createComboSelect(options, value) {
      const root = document.createElement("div");
      root.className = "combo";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "combo-btn";
      button.setAttribute("aria-haspopup", "listbox");
      button.setAttribute("aria-expanded", "false");
      const label = document.createElement("span");
      const caret = document.createElement("span");
      caret.className = "combo-caret";
      caret.textContent = "▾";
      button.append(label, caret);
      const pop = document.createElement("div");
      pop.className = "combo-pop";
      pop.setAttribute("role", "listbox");

      let current = options.includes(value) ? value : options[0];
      const optionButtons = options.map((option) => {
        const element = document.createElement("button");
        element.type = "button";
        element.className = "combo-opt";
        element.setAttribute("role", "option");
        const tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = "◈";
        const text = document.createElement("span");
        text.textContent = option;
        element.append(tick, text);
        element.addEventListener("click", () => {
          current = option;
          render();
          close();
          button.focus();
        });
        pop.appendChild(element);
        return element;
      });

      function render() {
        label.textContent = current;
        optionButtons.forEach((element, index) => {
          const selected = options[index] === current;
          element.classList.toggle("selected", selected);
          element.setAttribute("aria-selected", selected ? "true" : "false");
        });
      }

      function close() {
        root.classList.remove("open");
        button.setAttribute("aria-expanded", "false");
        document.removeEventListener("pointerdown", onOutside, true);
      }

      function open() {
        root.classList.add("open");
        button.setAttribute("aria-expanded", "true");
        document.addEventListener("pointerdown", onOutside, true);
        const active = optionButtons.find((element) => element.classList.contains("selected"));
        (active || optionButtons[0]).focus();
      }

      function onOutside(event) {
        if (!root.contains(event.target)) close();
      }

      button.addEventListener("click", () => root.classList.contains("open") ? close() : open());
      root.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && root.classList.contains("open")) {
          close();
          button.focus();
          return;
        }
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        event.preventDefault();
        if (!root.classList.contains("open")) { open(); return; }
        const count = optionButtons.length;
        const index = optionButtons.indexOf(document.activeElement);
        const next = index === -1
          ? (event.key === "ArrowDown" ? 0 : count - 1)
          : (event.key === "ArrowDown" ? (index + 1) % count : (index - 1 + count) % count);
        optionButtons[next].focus();
      });

      Object.defineProperty(root, "value", {
        get() { return current; },
        set(next) { current = options.includes(next) ? next : options[0]; render(); },
      });
      root.append(button, pop);
      render();
      return root;
    }

    let dataListSeq = 0;

    function providerIndex(card) {
      return Array.prototype.indexOf.call(
        document.querySelectorAll("#providers .provider"), card);

    function addProviderCard(provider, originalIndex) {
      const original = provider || {};
      const card = document.createElement("div");
      card.className = "provider";
      card.dataset.original = JSON.stringify(original);
      // 保存时随请求带回，后端按位恢复掩码密钥（勾选模型会让身份匹配失配）
      if (Number.isInteger(originalIndex))

      const modelNames = (original.ModelName || original.name || [])
        .filter((name) => typeof name === "string" && name.length > 0);

      // 视觉标注按模型存放；旧版布尔=整组继承，加载时展开成每个模型
      const visionByName = new Map();
      const baseCapabilities = original.Capabilities || original.capabilities || {};
      if (typeof baseCapabilities.vision === "boolean") {
        for (const name of modelNames) visionByName.set(name, baseCapabilities.vision);
      } else if (Array.isArray(baseCapabilities.vision)) {
        for (const name of baseCapabilities.vision)

      /* 头部：describe 标题 + 模型数统计 + 图标化删除 */

      const title = document.createElement("span");

      const meta = document.createElement("span");
      meta.className = "provider-meta";
      const count = document.createElement("span");
      count.className = "provider-count";
      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.textContent = "✕";
      remove.title = "删除该供应商";
      remove.setAttribute("aria-label", "删除该供应商");

      meta.append(count, remove);
      head.append(title, meta);
      card.appendChild(head);

      /* 供应商名称：注册表 describe 字段，仅作展示 */
      const describeInput = document.createElement("input");
      describeInput.type = "text";
      describeInput.dataset.field = "describe";
      describeInput.value = original.describe || "";
      describeInput.placeholder = "如：DeepSeek官方";
      const syncHead = () => {
        title.textContent = describeInput.value.trim() || "未命名供应商";
        const total = modelNames.length;
        count.classList.toggle("empty", total === 0);
        if (total === 0) {
          count.textContent = "无模型";
        } else {
          const number = document.createElement("strong");

        }
      };
      describeInput.addEventListener("input", syncHead);
      card.appendChild(providerRow("供应商名称", "仅作展示，写入注册表 describe 字段。", describeInput));

      const endpointInput = document.createElement("input");
      endpointInput.type = "text";
      endpointInput.dataset.field = "endpoint";
      endpointInput.value = original.api_endpoint || "";
      endpointInput.placeholder = "https://api.example.com/v1/chat/completions";
      card.appendChild(providerRow("API 端点", "完整的对话接口地址，如 https://api.deepseek.com/v1/chat/completions；模型列表从同一 base 段拉取。", endpointInput));

      const keyInput = document.createElement("input");
      keyInput.type = "password";
      keyInput.dataset.field = "apiKey";
      keyInput.placeholder = "留空保持原值（已掩码）";
      keyInput.autocomplete = "new-password";
      card.appendChild(providerRow("API Key", "组内所有模型共享的密钥；留空表示保持原值（掩码显示）。", keyInput));

      const standardSelect = createComboSelect(
        ["OpenAI", "Anthropic"],
        original.APIStandard === "Anthropic" ? "Anthropic" : "OpenAI");
      standardSelect.dataset.field = "standard";
      card.appendChild(providerRow("API 标准", "请求协议：OpenAI 兼容接口或 Anthropic 原生接口。", standardSelect));

      /* 模型：chips + 端点拉取勾选 + 手动输入兜底 */
      const modelZone = document.createElement("div");
      modelZone.className = "model-zone";

      const chips = document.createElement("div");
      chips.className = "model-chips";

      const listId = "model-names-" + (++dataListSeq);
      const dataList = document.createElement("datalist");
      dataList.id = listId;

      const manual = document.createElement("div");
      manual.className = "model-manual";
      manual.hidden = true;
      const manualInput = document.createElement("input");
      manualInput.type = "text";
      manualInput.placeholder = "输入模型名称，回车添加";
      manualInput.setAttribute("list", listId);
      const manualAdd = document.createElement("button");
      manualAdd.type = "button";
      manualAdd.className = "mini-btn";
      manualAdd.textContent = "添加";
      manual.append(manualInput, manualAdd);

      const actions = document.createElement("div");
      actions.className = "model-actions";
      const fetchButton = document.createElement("button");
      fetchButton.type = "button";
      fetchButton.className = "mini-btn";
      fetchButton.textContent = "⟳ 获取模型列表";
      const manualToggle = document.createElement("button");
      manualToggle.type = "button";
      manualToggle.className = "mini-btn";
      manualToggle.textContent = "+ 手动输入";
      const probeButton = document.createElement("button");
      probeButton.type = "button";
      probeButton.className = "mini-btn";
      probeButton.textContent = "◎ 检测视觉";
      probeButton.title = "对已选模型逐一发送极小图片请求，自动标注是否支持视觉输入";
      const noteLine = document.createElement("span");
      noteLine.className = "model-note";
      const errorLine = document.createElement("span");
      errorLine.className = "model-error";
      actions.append(fetchButton, manualToggle, probeButton, noteLine, errorLine);

      const picker = document.createElement("div");
      picker.className = "model-pick";
      const search = document.createElement("input");
      search.type = "text";
      search.placeholder = "搜索模型…";
      const pickList = document.createElement("div");
      pickList.className = "model-pick-list";
      picker.append(search, pickList);

      modelZone.append(chips, actions, manual, picker, dataList);
      card.appendChild(providerRow("模型", "优先从端点拉取实际可用的模型勾选；个别端点不提供列表接口时用“手动输入”兜底。chip 上的 ◉ 标注该模型支持视觉输入，可手动切换或用“检测视觉”自动探测。", modelZone));

      function renderChips() {
        chips.textContent = "";
        for (const name of modelNames) {
          const chip = document.createElement("span");
          chip.className = "chip";
          const hasVision = visionByName.get(name) === true;
          const visionToggle = document.createElement("button");
          visionToggle.type = "button";
          visionToggle.className = "chip-vision" + (hasVision ? " on" : "");
          visionToggle.textContent = hasVision ? "◉" : "○";
          visionToggle.title = hasVision ? "已标注支持视觉输入，点击取消" : "点击标注支持视觉输入";
          visionToggle.setAttribute("aria-label", name + " 的视觉输入标注");
          visionToggle.addEventListener("click", () => {
            visionByName.set(name, !(visionByName.get(name) === true));
            renderChips();
          });
          const text = document.createElement("span");
          text.textContent = name;
          const removeChip = document.createElement("button");
          removeChip.type = "button";
          removeChip.className = "chip-x";
          removeChip.textContent = "✕";
          removeChip.setAttribute("aria-label", "移除 " + name);
          removeChip.addEventListener("click", () => {
            modelNames.splice(modelNames.indexOf(name), 1);
            renderChips();
          });
          chip.append(visionToggle, text, removeChip);
          chips.appendChild(chip);
        }
        card.dataset.visionList = JSON.stringify(
          modelNames.filter((name) => visionByName.get(name) === true));
        syncHead();
      }

      function addModel(name) {
        if (!name || modelNames.includes(name)) return false;
        modelNames.push(name);
        renderChips();
        return true;
      }

      function syncDataList(extra) {
        dataList.textContent = "";
        for (const name of new Set([...modelNames, ...(extra || [])])) {
          const option = document.createElement("option");
          option.value = name;
          dataList.appendChild(option);
        }
      }

      let availableModels = null;

      function renderPickList() {
        pickList.textContent = "";
        const empty = document.createElement("div");
        empty.className = "model-pick-empty";
        if (!availableModels || !availableModels.length) {
          empty.textContent = "尚未获取到模型列表";
          pickList.appendChild(empty);
          return;
        }
        const query = search.value.trim().toLowerCase();
        const shown = availableModels
          .filter((name) => !query || name.toLowerCase().includes(query));
        if (!shown.length) {
          empty.textContent = "没有匹配的模型";
          pickList.appendChild(empty);
          return;
        }
        for (const name of shown) {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "pick-opt" + (modelNames.includes(name) ? " selected" : "");
          const tick = document.createElement("span");
          tick.className = "tick";
          tick.textContent = "◈";
          const text = document.createElement("span");
          text.textContent = name;
          option.append(tick, text);
          option.addEventListener("click", () => {
            if (!addModel(name)) {
              modelNames.splice(modelNames.indexOf(name), 1);
              renderChips();
            }
            option.classList.toggle("selected", modelNames.includes(name));
          });
          pickList.appendChild(option);
        }
      }

      function onOutsidePick(event) {
        if (!modelZone.contains(event.target)) closePicker();
      }

      function openPicker() {
        modelZone.classList.add("open");
        document.addEventListener("pointerdown", onOutsidePick, true);
        renderPickList();
      }

      function closePicker() {
        modelZone.classList.remove("open");
        document.removeEventListener("pointerdown", onOutsidePick, true);
      }

      search.addEventListener("input", renderPickList);

      fetchButton.addEventListener("click", async () => {
        errorLine.textContent = "";
        closePicker();
        const endpoint = endpointInput.value.trim();
        if (!endpoint) { errorLine.textContent = "请先填写 API 端点"; return; }
        const payload = { api_endpoint: endpoint, APIStandard: standardSelect.value };
        const index = providerIndex(card);
        if (index >= 0) payload.index = index;
        if (keyInput.value !== "") payload.api_key = keyInput.value;
        fetchButton.disabled = true;
        fetchButton.textContent = "拉取中…";
        try {
          const response = await request("/api/models/available",
            { method: "POST", body: JSON.stringify(payload) });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            errorLine.textContent = body.error || ("拉取失败：HTTP " + response.status);
            manual.hidden = false;
            return;
          }
          availableModels = body.models || [];
          syncDataList(availableModels);
          if (!availableModels.length) {
            errorLine.textContent = "端点未返回任何模型，可手动输入";
            manual.hidden = false;
            return;
          }
          openPicker();
        } catch (error) {
          if (error.message !== "unauthorized") {
            errorLine.textContent = "拉取失败：" + error.message;
            manual.hidden = false;
          }
        } finally {
          fetchButton.disabled = false;
          fetchButton.textContent = "⟳ 获取模型列表";
        }
      });

      manualToggle.addEventListener("click", () => {
        manual.hidden = !manual.hidden;
        if (!manual.hidden) manualInput.focus();
      });

      // 探测已选模型的视觉能力：逐个发送极小图片请求，结论三态（失败≠不支持）
      probeButton.addEventListener("click", async () => {
        if (!modelNames.length) { errorLine.textContent = "请先选择要检测的模型"; return; }
        const endpoint = endpointInput.value.trim();
        if (!endpoint) { errorLine.textContent = "请先填写 API 端点"; return; }
        errorLine.textContent = "";
        noteLine.textContent = "";
        const payloadBase = { api_endpoint: endpoint, APIStandard: standardSelect.value };
        const index = providerIndex(card);
        if (index >= 0) payloadBase.index = index;
        if (keyInput.value !== "") payloadBase.api_key = keyInput.value;
        const targets = [...modelNames];
        probeButton.disabled = true;
        let supported = 0;
        let unsupported = 0;
        const unknown = [];
        try {
          for (let i = 0; i < targets.length; i++) {
            const name = targets[i];
            noteLine.textContent = "检测中 " + (i + 1) + "/" + targets.length + "：" + name;
            const response = await request("/api/models/check-vision",
              { method: "POST", body: JSON.stringify({ ...payloadBase, model: name }) });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              errorLine.textContent = "检测失败：" + (body.error || ("HTTP " + response.status));
              noteLine.textContent = "";
              return;
            }
            if (body.result === "vision") { visionByName.set(name, true); supported++; }
            else if (body.result === "no-vision") { visionByName.set(name, false); unsupported++; }
            else unknown.push(name + (body.detail ? "（" + body.detail + "）" : ""));
          }
          noteLine.textContent = "检测完成：支持 " + supported + " · 不支持 " + unsupported +
            (unknown.length ? " · 无法判定 " + unknown.length : "");
          if (unknown.length)
            errorLine.textContent = "无法判定：" + unknown.join("；");
        } catch (error) {
          if (error.message !== "unauthorized")
            errorLine.textContent = "检测失败：" + error.message;
          noteLine.textContent = "";
        } finally {
          probeButton.disabled = false;
          renderChips();
        }
      });

      function submitManual() {
        if (addModel(manualInput.value.trim())) {
          manualInput.value = "";
          errorLine.textContent = "";
        }
        manualInput.focus();
      }
      manualAdd.addEventListener("click", submitManual);
      manualInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { event.preventDefault(); submitManual(); }
      });

      syncDataList();
      renderChips();
      $("providers").appendChild(card);
      return card;
    }

    function collectModels() {
      const Models = [];
      const originIndexes = [];
      for (const card of document.querySelectorAll("#providers .provider")) {
        let base = {};
        try { base = JSON.parse(card.dataset.original || "{}"); } catch { base = {}; }
        const provider = (base !== null && typeof base === "object" && !Array.isArray(base))
          ? base : {};

        provider.describe = card.querySelector('[data-field="describe"]').value.trim();
        provider.ModelName = Array.from(
          card.querySelectorAll(".model-chips .chip > span")).map((el) => el.textContent);
        provider.api_endpoint = card.querySelector('[data-field="endpoint"]').value.trim();
        const keyInput = card.querySelector('[data-field="apiKey"]');
        provider.api_key = keyInput.value === ""
          ? (typeof provider.api_key === "string" ? provider.api_key : SENTINEL)
          : keyInput.value;
        provider.APIStandard = card.querySelector('[data-field="standard"]').value;
        const capabilities = (provider.Capabilities && typeof provider.Capabilities === "object" &&
          !Array.isArray(provider.Capabilities)) ? provider.Capabilities : {};
        // 视觉标注物化为按模型名单；全组无标注时不留键（旧布尔形态在保存时自动迁移）
        let visionList = [];
        try { visionList = JSON.parse(card.dataset.visionList || "[]"); }
        catch { visionList = []; }
        if (visionList.length) capabilities.vision = visionList;
        else delete capabilities.vision;
        provider.Capabilities = capabilities;
        delete provider.name;
        delete provider.capabilities;
        Models.push(provider);
        originIndexes.push(card.dataset.originalIndex === undefined
          ? null
          : Number(card.dataset.originalIndex));
      }
      return { Models, originIndexes };
    }

    async function loadModels() {
      try {
        const response = await request("/api/models", { method: "GET" });
        if (!response.ok) { showBanner("读取模型注册表失败：HTTP " + response.status, true); return; }
        const body = await response.json();
        const info = $("registryInfo");
        info.textContent = "注册表文件：" + body.registry_path +
          (body.exists ? "" : "（文件尚不存在，首次保存时将创建）") +
          "。保存后需重启机器人，新注册表才会被加载。";
        const providers = $("providers");
        providers.textContent = "";
        const list = (body.models && body.models.Models) || [];
        list.forEach((provider, index) => addProviderCard(provider, index));
        if (!list.length)
          info.textContent += " 当前没有注册任何供应商，点击上方按钮添加。";
        modelsLoaded = true;
        $("banner").className = "";
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    async function saveModels() {
      clearMarks();
      const candidate = collectModels();
      try {
        const response = await request("/api/models", { method: "POST", body: JSON.stringify(candidate) });
        const body = await response.json();
        if (response.status === 422) {
          showBanner("保存被拒绝（" + (body.diagnostics || []).length + " 条诊断）：\n" +
            diagnosticsText(body.diagnostics), true);
          return;
        }
        if (!response.ok) { showBanner("保存失败：HTTP " + response.status, true); return; }
        let text = "模型注册表已保存。需重启机器人后新配置才会生效。";
        if ((body.warnings || []).length) text += "\n警告：\n" + diagnosticsText(body.warnings);
        showBanner(text, false);
        await loadModels();
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    /* ---------- 入口 ---------- */

    $("save").addEventListener("click", () => activePane === MODELS_KEY ? saveModels() : saveConfig());
    $("reload").addEventListener("click", () => activePane === MODELS_KEY ? loadModels() : loadConfig());
    $("addProvider").addEventListener("click", () => {
      const card = addProviderCard(null);
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.querySelector('[data-field="describe"]').focus();
    });
    function setLoginError(text) {
      $("loginError").textContent = text;
      if (!text) return;
      // 重置动画再挂类名，连续输错时每次都能触发抖动
      const card = document.querySelector("#login .card");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      $("token").select();
    }

    $("tokenOk").addEventListener("click", async () => {
      const value = $("token").value.trim();
      if (!value) {
        setLoginError("请输入访问令牌。");
        return;
      }
      localStorage.setItem(TOKEN_STORAGE, value);
      $("tokenOk").disabled = true;
      setLoginError("");
      try {
        // 先用新令牌验证一次，通过才关闭弹层，输错不再"闪一下又弹回"
        await request("/api/config", { method: "GET" });
        $("login").style.display = "none";
        await loadConfig();
      } catch (error) {
        if (error.message === "unauthorized")
          setLoginError("令牌不正确，请重新输入。");
        else
          setLoginError("无法连接面板服务：" + error.message);
      } finally {
        $("tokenOk").disabled = false;
      }
    });
    $("token").addEventListener("keydown", (event) => {
      if (event.key === "Enter") $("tokenOk").click();
    });

    /* ---------- 背景网格聚光 ---------- */

    // 指针坐标写入 CSS 变量，点亮 body::after 的局部网格；rAF 合帧避免高频样式更新
    (() => {
      let frame = 0;
      window.addEventListener("pointermove", (event) => {
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          document.body.style.setProperty("--mx", event.clientX + "px");
          document.body.style.setProperty("--my", event.clientY + "px");
          document.body.classList.add("grid-live");
        });
      }, { passive: true });
      document.documentElement.addEventListener("mouseleave", () => {
        if (frame) { cancelAnimationFrame(frame); frame = 0; }
        document.body.classList.remove("grid-live");
      });
      window.addEventListener("pointerup", (event) => {
        // 触屏/笔抬起后指针不再存在，避免光斑滞留在最后触点
        if (event.pointerType !== "mouse") document.body.classList.remove("grid-live");
      });
    })();

    loadConfig();
  </script>
</body>

</html>
