    * {
      box-sizing: border-box;
    }

    html {
      scrollbar-color: rgba(200, 230, 215, .16) transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 480px at 82% -10%, rgba(78, 217, 160, .07), transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    /* 实验室坐标网格，极淡，向页面下方渐隐 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(220, 240, 230, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220, 240, 230, .03) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 20%, transparent 85%);
      mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 20%, transparent 85%);
    }

    ::selection {
      background: rgba(78, 217, 160, .3);
      color: #ecfff5;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(200, 230, 215, .14);
      border-radius: 5px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(200, 230, 215, .26);
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    button {
      font-family: inherit;
    }

    /* ============ 顶栏 ============ */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 56px;
      padding: 0 24px;
      background: rgba(20, 26, 23, .85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line-2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 品牌头像：透明底 PNG（data URI），六边形容器 + 淡绿辉光 */
    .avatar {
      width: 34px;
      height: 39px;
      flex: none;
      background: var(--klein-avatar) center / cover no-repeat;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      filter: drop-shadow(0 0 6px rgba(78, 217, 160, .3));
    }

    .brand-text h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .3em;
      line-height: 1.15;
      color: var(--text);
    }

    .brand-sub {
      display: block;
      margin-top: 1px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .14em;
      color: var(--faint);
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 14px;
      letter-spacing: .03em;
      cursor: pointer;
      transition: filter .15s, box-shadow .15s, background .15s, border-color .15s, transform .06s;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* 主按钮用近白高对比，绿色只留给辉光，避免满屏绿 */
    .btn.primary {
      background: #e9f5ef;
      border: 1px solid transparent;
      color: #0a1512;
      font-weight: 600;
    }

    .btn.primary:hover {
      background: #ffffff;
      box-shadow: 0 0 22px rgba(78, 217, 160, .22);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--muted);
    }

    .btn.ghost:hover {
      color: var(--text);
      border-color: rgba(200, 230, 215, .3);
      background: rgba(200, 230, 215, .04);
    }

    .btn.ghost svg {
      transform: rotate(-35deg);
    }

    /* ============ 控制台骨架：侧边导航 + 内容面板 ============ */

    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      max-width: 1220px;
      margin: 56px auto 0;
      min-height: calc(100vh - 56px);
    }

    #sideNav {
      flex: none;
      width: 232px;
      position: sticky;
      top: 56px;
      align-self: flex-start;
      height: calc(100vh - 56px);
      overflow-y: auto;
      padding: 22px 14px 30px;
      border-right: 1px solid var(--line);
      counter-reset: nav;
    }

    .nav-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--faint);
      padding: 0 12px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s, background .15s;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(200, 230, 215, .05);
    }

    .nav-item.active {
      color: var(--text);
      background: var(--mint-soft);
      box-shadow: inset 2px 0 0 var(--mint);
    }

    .nav-item .code {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--faint);
      flex: none;
      min-width: 26px;
    }

    .nav-item.active .code {
      color: var(--mint);
    }

    .nav-item .code::before {
      counter-increment: nav;
      content: "M" counter(nav, decimal-leading-zero);
    }

    .nav-item svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .nav-sep {
      height: 1px;
      background: var(--line);
      margin: 12px 6px;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 30px 40px 90px;
      max-width: 780px;
    }

    /* ============ 内容面板 ============ */

    .pane {
      display: none;
    }

    .pane.active {
      display: block;
      animation: pane-in .18s ease;
    }

    @keyframes pane-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    .pane h2 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .pane-hint {
      margin: 0 0 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    #banner {
      display: none;
      margin-bottom: 20px;
      padding: 12px 16px;
      border: 1px solid var(--line-2);
      border-left: 3px solid var(--mint);
      border-radius: 0 10px 10px 0;
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: var(--text);
    }

    #banner::before {
      display: block;
      font-weight: 700;
      letter-spacing: .12em;
      margin-bottom: 4px;
      color: var(--mint);
    }

    #banner.ok {
      display: block;
      animation: pane-in .2s ease;
    }

    #banner.ok::before {
      content: "[ LAB · OK ]";
    }

    #banner.err {
      display: block;
      border-left-color: var(--danger);
      animation: pane-in .2s ease;
    }

    #banner.err::before {
      content: "[ LAB · ERR ]";
      color: var(--danger);
    }

    .note {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-left: 2px solid var(--line-2);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ============ 子模块（配置子对象）============ */

    .fields {
      counter-reset: module;
    }

    details.section {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 14px;
      background: var(--surface-2);
    }

    details.section>summary {
      padding: 12px 44px 12px 16px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .03em;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      list-style: none;
      border-radius: 12px 12px 0 0;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    details.section>summary::before {
      counter-increment: module;
      content: "M" counter(module, decimal-leading-zero);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--faint);
      margin-right: 10px;
    }

    details.section[open]>summary::before {
      color: var(--mint);
    }

    details.section::after {
      content: "+";
      position: absolute;
      top: 10px;
      right: 15px;
      font-family: var(--mono);
      font-size: 15px;
      color: var(--faint);
      transition: color .2s;
    }

    details.section[open]::after {
      content: "−";
      color: var(--mint);
    }

    details.section .row:last-child,
    .provider .row:last-child {
      border-radius: 0 0 12px 12px;
    }

    [data-hint] {
      position: relative;
    }

    .row label[data-hint] {
      cursor: help;
    }

    [data-hint]::after {
      content: attr(data-hint);
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 6px;
      background: #1e2823;
      color: #dceee4;
      padding: 8px 12px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.65;
      white-space: normal;
      width: max-content;
      max-width: 380px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease .25s, visibility .12s ease .25s;
    }

    [data-hint]:hover::after {
      opacity: 1;
      visibility: visible;
    }

    .row {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 8px 18px;
      align-items: center;
      padding: 11px 16px 11px 20px;
      border-top: 1px solid var(--line);
    }

    .row:hover {
      background: rgba(200, 230, 215, .02);
    }

    .row label {
      font-size: 14.5px;
      color: var(--muted);
    }

    .row label .path {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: .02em;
      color: var(--faint);
      display: block;
      margin-top: 2px;
      font-weight: 400;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #4e5e56;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(78, 217, 160, .13);
    }

    input.invalid,
    textarea.invalid {
      border-color: #f87171;
      background: rgba(248, 113, 113, .05);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, .12);
    }

    input[type=checkbox] {
      width: 18px;
      height: 18px;
      accent-color: var(--mint);
    }

    textarea {
      min-height: 80px;
    }

    select option {
      background: var(--surface);
    }

    #modelsView textarea {
      font-family: var(--mono);
      font-size: 13px;
    }

    /* ============ 供应商 ============ */

    .provider {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 14px;
      background: var(--surface-2);
    }

    .provider-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      border-radius: 12px 12px 0 0;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: .02em;
      color: var(--text);
    }

    .provider-head::before {
      content: "◈";
      color: var(--mint);
      font-size: 11px;
      margin-right: 2px;
    }

    .remove {
      background: rgba(248, 113, 113, .08);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, .3);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 13.5px;
      cursor: pointer;
      transition: background .15s;
    }

    .remove:hover {
      background: rgba(248, 113, 113, .18);
    }

    #addProvider {
      background: transparent;
      color: var(--muted);
      border: 1px dashed var(--line-2);
      border-radius: 10px;
      padding: 12px 18px;
      width: 100%;
      font-size: 15px;
      letter-spacing: .05em;
      cursor: pointer;
      transition: color .15s, border-color .15s, box-shadow .15s;
    }

    #addProvider:hover {
      color: var(--mint);
      border-color: rgba(78, 217, 160, .45);
      box-shadow: 0 0 16px rgba(78, 217, 160, .08);
    }

    .hint {
      font-size: 12px;
      color: var(--faint);
    }

    /* ============ 登录与页脚 ============ */

    #login {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 7, .68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }

    #login .card {
      background: linear-gradient(180deg, #1e2823, #181f1b);
      border: 1px solid var(--line-2);
      border-radius: 16px;
      padding: 30px 28px;
      width: 380px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55), 0 0 40px rgba(78, 217, 160, .06);
    }

    #login .avatar {
      width: 64px;
      height: 74px;
      margin: 0 auto;
      filter: drop-shadow(0 0 10px rgba(78, 217, 160, .25));
    }

    #login h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: .12em;
    }

    #login p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    #login p.flavor {
      font-size: 13px;
      font-style: italic;
      color: var(--faint);
    }

    #login input {
      text-align: center;
    }

    #loginError {
      margin: 0;
      min-height: 17px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--danger);
    }

    #login .card.shake {
      animation: login-shake .32s ease;
    }

    @keyframes login-shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(3px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-5px);
      }

      40%,
      60% {
        transform: translateX(5px);
      }
    }

    .btn.wide {
      width: 100%;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .03em;
      line-height: 1.9;
      color: var(--faint);
    }

    footer .tagline {
      display: block;
      margin-top: 4px;
      color: #5c6e64;
    }

    /* ============ 响应式与可访问性 ============ */

    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
      }

      #sideNav {
        position: sticky;
        top: 56px;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        padding: 10px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .nav-label,
      .nav-sep {
        display: none;
      }

      .nav-item {
        width: auto;
        white-space: nowrap;
        padding: 7px 12px;
      }

      .nav-item .code {
        display: none;
      }

      .content {
        padding: 22px 18px 70px;
      }
    }

    @media (max-width: 640px) {
      .brand-sub {
        display: none;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="avatar" role="img" aria-label="Klein"></div>
      <div class="brand-text">
        <h1>KLEIN</h1>
        <span class="brand-sub">MOBIUS LAB</span>
      </div>
    </div>
    <div class="actions">
      <button id="reload" class="btn ghost" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M3 8 H0.9 M0.9 5.4 V10.6 M3 5.2 H10.4 V10.8 H3 Z M10.4 8 H15 M5.2 5.2 V7.4 M7.4 5.2 V7.4" />
          </g>
        </svg>
        重新加载
      </button>
      <button id="save" class="btn primary" type="button">
        <svg viewBox="0 0 11 14" aria-hidden="true">
          <path d="M7 1 L2 8 H5.5 L5 13 L10 5.5 H6.5 Z" fill="currentColor" />
        </svg>
        保存并应用
      </button>
    </div>
  </header>
  <div class="shell">
    <nav id="sideNav" aria-label="配置导航"></nav>
    <main class="content">
      <div id="banner"></div>
      <div id="panes"></div>
      <div id="modelsView" style="display:none">
        <h2>模型供应商</h2>
        <p class="pane-hint">模型注册表里的每一组供应商：共享密钥的一批模型名、API 端点与协议标准。</p>
        <div class="note" id="registryInfo">正在加载模型注册表……</div>
        <div id="providers"></div>
        <button id="addProvider" type="button">＋ 添加供应商</button>
      </div>
      <footer>保存后立即写盘并刷新内存快照；标注“需重启”的项在机器人重启后生效。密钥字段留空表示保持原值。
        <span class="tagline">KLEIN · MOBIUS LAB TERMINAL</span>
      </footer>
    </main>
  </div>
  <div id="login">
    <div class="card">
      <div class="avatar" role="img" aria-label="Klein"></div>
      <h2>访问鉴权</h2>
      <p>请输入配置中 webui.access_token 对应的访问令牌。</p>
      <p class="flavor">「令牌不对的话，梅比乌斯博士会不高兴的。」</p>
      <input id="token" type="password" placeholder="访问令牌">
      <p id="loginError" class="login-error" role="alert"></p>
      <button id="tokenOk" class="btn primary wide" type="button">
        <svg viewBox="0 0 11 14" aria-hidden="true">
          <path d="M7 1 L2 8 H5.5 L5 13 L10 5.5 H6.5 Z" fill="currentColor" />
        </svg>
        连接
      </button>
    </div>
  </div>
  <script>
    "use strict";
    const SENTINEL = "__KLEIN_MASKED__";

    // 字段说明：悬停显示。按“完整路径 → 通用键名”两级查找，传输 Profile 的动态路径靠兜底层覆盖
    const SECTION_HINTS = {
      bot: "机器人的身份与基本行为：QQ 号、管理员、群聊开关。",

    function hintFor(path, key) {
      return FIELD_HINTS[path] || KEY_HINTS[key] || "";
    }

    const $ = (id) => document.getElementById(id);
    const token = () => localStorage.getItem(TOKEN_STORAGE) || "";

    function label(key, isSection) {
      if (isSection && SECTION_LABELS[key]) return SECTION_LABELS[key];
      return KEY_LABELS[key] || key;
    }

    /* ---------- 通用 ---------- */

    async function request(path, options) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (token()) headers["Authorization"] = "Bearer " + token();
      const response = await fetch(path, Object.assign({}, options, { headers }));
      if (response.status === 401) { $("login").style.display = "flex"; throw new Error("unauthorized"); }
      return response;
    }

    function showBanner(text, isError) {
      const banner = $("banner");
      banner.textContent = text;
      banner.className = isError ? "err" : "ok";
    }

    function diagnosticsText(items) {
      return (items || []).map((d) => d.severity + " " + d.path + " - " + d.message).join("\n");
    }

    function clearMarks() {
      for (const input of document.querySelectorAll(".invalid")) {
        input.classList.remove("invalid");
        input.title = "";
      }
    }

    /* ---------- 主配置：侧边导航 + 面板 ---------- */

    function navItem(key, name) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "nav-item";
      item.dataset.key = key;
      const code = document.createElement("span");
      code.className = "code";
      const text = document.createElement("span");
      text.textContent = name;
      item.appendChild(code);
      item.appendChild(text);
      item.addEventListener("click", () => selectPane(key));
      return item;
    }

    function modelsNavItem() {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "nav-item";
      item.dataset.key = MODELS_KEY;
      item.innerHTML =
        '<svg viewBox="0 0 16 16" aria-hidden="true">' +
        '<g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">' +
        '<path d="M3 8 H0.9 M0.9 5.4 V10.6 M3 5.2 H10.4 V10.8 H3 Z M10.4 8 H15 M5.2 5.2 V7.4 M7.4 5.2 V7.4"/>' +
        '</g></svg><span>模型供应商</span>';
      item.addEventListener("click", () => selectPane(MODELS_KEY));
      return item;
    }

    function selectPane(key) {
      activePane = key;
      for (const item of document.querySelectorAll(".nav-item"))
        item.classList.toggle("active", item.dataset.key === key);
      for (const pane of document.querySelectorAll(".pane"))
        pane.classList.toggle("active", pane.dataset.key === key);
      $("modelsView").style.display = key === MODELS_KEY ? "" : "none";
      if (key === MODELS_KEY && !modelsLoaded) loadModels();
      $("banner").className = "";
    }

    function rowFor(path, labelText, hint) {
      const row = document.createElement("div");
      row.className = "row";
      const labelElement = document.createElement("label");
      labelElement.innerHTML = labelText.replace(/</g, "&lt;") + '<span class="path"></span>';
      labelElement.querySelector(".path").textContent = path;
      if (hint) labelElement.dataset.hint = hint;
      row.appendChild(labelElement);
      return row;
    }

    function renderValue(parent, key, value, path, isSection) {
      if (value !== null && typeof value === "object" && !Array.isArray(value)) {
        const section = document.createElement("details");
        section.className = "section";
        section.dataset.key = key;
        if (isSection) section.open = true;
        const summary = document.createElement("summary");
        summary.textContent = label(key, true);
        if (SECTION_HINTS[key]) summary.dataset.hint = SECTION_HINTS[key];
        section.appendChild(summary);
        const fields = document.createElement("div");
        fields.className = "fields";
        section.appendChild(fields);
        for (const [childKey, childValue] of Object.entries(value))
          renderValue(fields, childKey, childValue, path ? path + "." + childKey : childKey, false);
        parent.appendChild(section);
        return;
      }

      const row = rowFor(path, label(key, false), hintFor(path, key));
      let input;
      if (Array.isArray(value)) {
        input = document.createElement("textarea");
        input.value = JSON.stringify(value, null, 2);
        input.dataset.kind = "json";
      } else if (typeof value === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = value;
        input.dataset.kind = "bool";
      } else if (typeof value === "number") {
        input = document.createElement("input");
        input.type = "number";
        input.step = "any";
        input.value = value;
        input.dataset.kind = "number";
        input.dataset.int = Number.isInteger(value) ? "1" : "";
        input.dataset.original = String(value);
      } else if (SECRET_KEYS.has(key)) {
        input = document.createElement("input");
        input.type = "password";
        input.placeholder = "留空保持原值（已掩码）";
        input.dataset.kind = "secret";
        input.dataset.original = typeof value === "string" ? value : SENTINEL;
        input.autocomplete = "new-password";
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = value === null ? "" : value;
        input.dataset.kind = "null";
        input.dataset.original = value === null ? "null" : String(value);
      }
      input.dataset.path = path;
      row.appendChild(input);
      parent.appendChild(row);
    }

    function collectFrom(container) {
      const result = {};
      for (const child of container.children) {
        if (child.classList.contains("section")) {
          result[child.dataset.key] = collectFrom(child.querySelector(".fields"));
          continue;
        }
        const input = child.querySelector("input, textarea");
        if (!input || !input.dataset.path) continue;
        const key = input.dataset.path.split(".").pop();
        const kind = input.dataset.kind;
        if (kind === "bool") result[key] = input.checked;
        else if (kind === "secret")
          result[key] = input.value === "" ? input.dataset.original : input.value;
        else if (kind === "number") {
          let raw = input.value;
          if (raw === "") raw = input.dataset.original;
          const number = input.dataset.int === "1" ? Number.parseInt(raw, 10) : Number.parseFloat(raw);
          result[key] = Number.isNaN(number) ? Number(input.dataset.original) : number;
        } else if (kind === "json") {
          try { result[key] = JSON.parse(input.value || "[]"); }
          catch { result[key] = null; input.classList.add("invalid"); input.title = "JSON 解析失败"; }
        } else {
          const original = input.dataset.original;
          result[key] = input.value === "" && original === "null" ? null : input.value;
        }
      }
      return result;
    }

    function collectConfig() {
      const result = {};
      for (const pane of $("panes").children) {
        const inner = collectFrom(pane.querySelector(".fields"));
        result[pane.dataset.key] = pane.dataset.scalar === "1"
          ? inner[pane.dataset.key] : inner;
      }
      return result;
    }

    function markFields(diagnostics) {
      for (const diagnostic of diagnostics) {
        const input = document.querySelector('[data-path="' + diagnostic.path + '"]');
        if (input) { input.classList.add("invalid"); input.title = diagnostic.message; }
      }
    }

    function showSaveResult(body) {
      const counts = body.counts || {};
      const total = (counts.dynamic || 0) + (counts.rebuild || 0) + (counts.restart || 0);
      let text = "已保存并刷新内存快照。" +
        "变更 " + total + " 项（动态 " + (counts.dynamic || 0) +
        "、需重建 " + (counts.rebuild || 0) + "、需重启 " + (counts.restart || 0) + "）。";
      const groups = {};
      for (const change of body.diff || [])
        (groups[change.impact] = groups[change.impact] || []).push(change.path);
      for (const impact of ["restart", "rebuild"]) {
        const paths = groups[impact];
        if (paths && paths.length)
          text += "\n【" + IMPACT_LABELS[impact] + "】" + paths.join("、");
      }
      if (counts.restart > 0) text += "\n需重启的项要重启机器人后才会生效。";
      const extra = (body.diagnostics || []).concat(body.warnings || []);
      if (extra.length) text += "\n诊断：" + diagnosticsText(extra);
      showBanner(text, false);
    }

    async function loadConfig() {
      try {
        const response = await request("/api/config", { method: "GET" });
        if (!response.ok) { showBanner("读取配置失败：HTTP " + response.status, true); return; }
        const document_ = await response.json();
        const nav = $("sideNav");
        nav.textContent = "";
        const navLabel = document.createElement("div");
        navLabel.className = "nav-label";
        navLabel.textContent = "配置模块";
        nav.appendChild(navLabel);
        const panes = $("panes");
        panes.textContent = "";
        let firstKey = "";
        for (const [key, value] of Object.entries(document_)) {
          if (!firstKey) firstKey = key;
          nav.appendChild(navItem(key, label(key, true)));
          const pane = document.createElement("section");
          pane.className = "pane";
          pane.dataset.key = key;
          const heading = document.createElement("h2");
          heading.textContent = label(key, true);
          pane.appendChild(heading);
          const hint = document.createElement("p");
          hint.className = "pane-hint";
          hint.textContent = SECTION_HINTS[key] || "";
          pane.appendChild(hint);
          const fields = document.createElement("div");
          fields.className = "fields";
          pane.appendChild(fields);
          // 顶层标量（如 schema_version）没有子对象，直接渲染成行并打上
          // scalar 标记：collectConfig 按此解包，避免 collectFrom 再包一层
          if (value !== null && typeof value === "object" && !Array.isArray(value)) {
            for (const [childKey, childValue] of Object.entries(value))
              renderValue(fields, childKey, childValue, key + "." + childKey, false);
          } else {
            pane.dataset.scalar = "1";
            renderValue(fields, key, value, key, false);
          }
          panes.appendChild(pane);
        }
        const sep = document.createElement("div");
        sep.className = "nav-sep";
        nav.appendChild(sep);
        nav.appendChild(modelsNavItem());
        const known = activePane === MODELS_KEY ||
          document.querySelectorAll('.pane[data-key="' + activePane + '"]').length > 0;
        selectPane(known && activePane ? activePane : (firstKey || MODELS_KEY));
        $("banner").className = "";
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    async function saveConfig() {
      clearMarks();
      const candidate = collectConfig();
      try {
        const response = await request("/api/config", { method: "POST", body: JSON.stringify(candidate) });
        const body = await response.json();
        if (response.status === 422) {
          markFields(body.diagnostics || []);
          showBanner("保存被拒绝（" + (body.diagnostics || []).length + " 条诊断）：\n" +
            diagnosticsText(body.diagnostics), true);
          return;
        }
        if (!response.ok) { showBanner("保存失败：HTTP " + response.status, true); return; }
        showSaveResult(body);
        await loadConfig();
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    }

    function collectModels() {
      const Models = [];
      for (const card of document.querySelectorAll("#providers .provider")) {
        let base = {};
        try { base = JSON.parse(card.dataset.original || "{}"); } catch { base = {}; }
        const provider = (base !== null && typeof base === "object" && !Array.isArray(base))
          ? base : {};

        const names = card.querySelector('[data-field="names"]').value
          .split("\n").map((line) => line.trim()).filter((line) => line.length > 0);
        provider.ModelName = names;
        provider.api_endpoint = card.querySelector('[data-field="endpoint"]').value.trim();
        const keyInput = card.querySelector('[data-field="apiKey"]');
        provider.api_key = keyInput.value === ""
          ? (typeof provider.api_key === "string" ? provider.api_key : SENTINEL)
          : keyInput.value;
        provider.APIStandard = card.querySelector('[data-field="standard"]').value;
        const capabilities = (provider.Capabilities && typeof provider.Capabilities === "object" &&
          !Array.isArray(provider.Capabilities)) ? provider.Capabilities : {};
        capabilities.vision = card.querySelector('[data-field="vision"]').checked;
        provider.Capabilities = capabilities;
        delete provider.name;
        delete provider.capabilities;
        Models.push(provider);
      }
      return { Models };
    }

    async function loadModels() {
      try {
        const response = await request("/api/models", { method: "GET" });
        if (!response.ok) { showBanner("读取模型注册表失败：HTTP " + response.status, true); return; }
        const body = await response.json();
        const info = $("registryInfo");
        info.textContent = "注册表文件：" + body.registry_path +
          (body.exists ? "" : "（文件尚不存在，首次保存时将创建）") +
          "。保存后需重启机器人，新注册表才会被加载。";
        const providers = $("providers");
        providers.textContent = "";
        const list = (body.models && body.models.Models) || [];
        for (const provider of list) addProviderCard(provider);
        if (!list.length)
          info.textContent += " 当前没有注册任何供应商，点击下方按钮添加。";
        modelsLoaded = true;
        $("banner").className = "";
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    async function saveModels() {
      clearMarks();
      const candidate = collectModels();
      try {
        const response = await request("/api/models", { method: "POST", body: JSON.stringify(candidate) });
        const body = await response.json();
        if (response.status === 422) {
          showBanner("保存被拒绝（" + (body.diagnostics || []).length + " 条诊断）：\n" +
            diagnosticsText(body.diagnostics), true);
          return;
        }
        if (!response.ok) { showBanner("保存失败：HTTP " + response.status, true); return; }
        let text = "模型注册表已保存。需重启机器人后新配置才会生效。";
        if ((body.warnings || []).length) text += "\n警告：\n" + diagnosticsText(body.warnings);
        showBanner(text, false);
        await loadModels();
      } catch (error) {
        if (error.message !== "unauthorized") showBanner("无法连接面板服务：" + error.message, true);
      }
    }

    /* ---------- 入口 ---------- */

    $("save").addEventListener("click", () => activePane === MODELS_KEY ? saveModels() : saveConfig());
    $("reload").addEventListener("click", () => activePane === MODELS_KEY ? loadModels() : loadConfig());
    $("addProvider").addEventListener("click", () => addProviderCard(null));
    function setLoginError(text) {
      $("loginError").textContent = text;
      if (!text) return;
      // 重置动画再挂类名，连续输错时每次都能触发抖动
      const card = document.querySelector("#login .card");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      $("token").select();
    }

    $("tokenOk").addEventListener("click", async () => {
      const value = $("token").value.trim();
      if (!value) {
        setLoginError("请输入访问令牌。");
        return;
      }
      localStorage.setItem(TOKEN_STORAGE, value);
      $("tokenOk").disabled = true;
      setLoginError("");
      try {
        // 先用新令牌验证一次，通过才关闭弹层，输错不再"闪一下又弹回"
        await request("/api/config", { method: "GET" });
        $("login").style.display = "none";
        await loadConfig();
      } catch (error) {
        if (error.message === "unauthorized")
          setLoginError("令牌不正确，请重新输入。");
        else
          setLoginError("无法连接面板服务：" + error.message);
      } finally {
        $("tokenOk").disabled = false;
      }
    });
    $("token").addEventListener("keydown", (event) => {
      if (event.key === "Enter") $("tokenOk").click();
    });
    loadConfig();
  </script>
</body>

</html>
